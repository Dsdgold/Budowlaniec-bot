<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Budowlaniec Bot</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Chart.js z CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
  <style>
    /* === RESET I BAZOWE STYLE === */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      /* Domyślne kolory — nadpisywane przez Telegram theme */
      --bg: var(--tg-theme-bg-color, #1a1a2e);
      --text: var(--tg-theme-text-color, #e2e8f0);
      --hint: var(--tg-theme-hint-color, #94a3b8);
      --link: var(--tg-theme-link-color, #3b82f6);
      --btn: var(--tg-theme-button-color, #3b82f6);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #16213e);
      --section-bg: var(--tg-theme-section-bg-color, #1e293b);
      --section-header: var(--tg-theme-section-header-text-color, #94a3b8);
      --accent: var(--tg-theme-accent-text-color, #3b82f6);
      --destructive: var(--tg-theme-destructive-text-color, #ef4444);

      /* Pomocnicze */
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f59e0b;
      --radius: 12px;
      --radius-sm: 8px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: calc(70px + var(--safe-bottom));
      -webkit-font-smoothing: antialiased;
    }

    /* === NAWIGACJA — BOTTOM TAB BAR === */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: var(--secondary-bg);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 6px 0 calc(6px + var(--safe-bottom));
      z-index: 1000;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 0;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      background: none;
      color: var(--hint);
      font-size: 10px;
      font-family: inherit;
    }

    .tab-item.active {
      color: var(--btn);
    }

    .tab-item .tab-icon {
      font-size: 22px;
      line-height: 1;
      transition: transform 0.2s;
    }

    .tab-item.active .tab-icon {
      transform: scale(1.1);
    }

    /* === SEKCJE (STRONY) === */
    .page {
      display: none;
      padding: 16px;
      animation: fadeIn 0.25s ease;
      min-height: calc(100vh - 70px);
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* === NAGŁÓWEK STRONY === */
    .page-header {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text);
    }

    .page-subheader {
      font-size: 0.85rem;
      color: var(--hint);
      margin-top: -12px;
      margin-bottom: 16px;
    }

    /* === KARTY === */
    .card {
      background: var(--section-bg);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card:active {
      transform: scale(0.98);
    }

    /* === KATEGORIE — HORYZONTALNY SCROLL === */
    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 12px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-snap-type: x mandatory;
    }

    .category-scroll::-webkit-scrollbar { display: none; }

    .category-chip {
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: 20px;
      background: var(--secondary-bg);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--hint);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      scroll-snap-align: start;
      white-space: nowrap;
      font-family: inherit;
    }

    .category-chip.active {
      background: var(--btn);
      color: var(--btn-text);
      border-color: var(--btn);
    }

    /* === LISTA PRODUKTÓW === */
    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: var(--section-bg);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: all 0.15s;
    }

    .product-item:active {
      transform: scale(0.98);
      background: var(--secondary-bg);
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-seller {
      font-size: 0.75rem;
      color: var(--hint);
      margin-top: 2px;
    }

    .product-price-wrap {
      text-align: right;
      flex-shrink: 0;
      margin-left: 12px;
    }

    .product-price {
      font-size: 1rem;
      font-weight: 700;
    }

    .product-change {
      font-size: 0.7rem;
      font-weight: 600;
      margin-top: 2px;
    }

    .product-change.up { color: var(--red); }
    .product-change.down { color: var(--green); }

    .badge-promo {
      display: inline-block;
      background: var(--orange);
      color: #000;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* === SPARKLINE (mini wykres przy produkcie) === */
    .sparkline {
      width: 50px;
      height: 20px;
      margin-left: 8px;
      flex-shrink: 0;
    }

    /* === FILTRY === */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 12px;
      border-radius: 16px;
      background: var(--secondary-bg);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--hint);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .filter-btn.active {
      background: var(--btn);
      color: var(--btn-text);
      border-color: var(--btn);
    }

    /* === NEWSY — STORY CIRCLES === */
    .stories-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 8px 0 16px;
      scrollbar-width: none;
    }

    .stories-row::-webkit-scrollbar { display: none; }

    .story-circle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .story-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--btn), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      border: 2px solid var(--btn);
      padding: 2px;
    }

    .story-name {
      font-size: 0.65rem;
      color: var(--hint);
      max-width: 64px;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .news-card {
      background: var(--section-bg);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
    }

    .news-card:active { transform: scale(0.98); transition: transform 0.15s; }

    .news-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .news-summary {
      font-size: 0.8rem;
      color: var(--hint);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.7rem;
      color: var(--hint);
    }

    /* === TRENDY — WYKRES === */
    .chart-container {
      position: relative;
      height: 250px;
      margin: 12px 0;
      background: var(--section-bg);
      border-radius: var(--radius);
      padding: 12px;
    }

    .period-toggle {
      display: flex;
      gap: 4px;
      background: var(--secondary-bg);
      border-radius: 20px;
      padding: 3px;
      margin-bottom: 12px;
      width: fit-content;
    }

    .period-btn {
      padding: 6px 16px;
      border-radius: 16px;
      border: none;
      background: none;
      color: var(--hint);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .period-btn.active {
      background: var(--btn);
      color: var(--btn-text);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .stat-mini {
      background: var(--section-bg);
      border-radius: var(--radius-sm);
      padding: 12px;
      text-align: center;
    }

    .stat-mini .stat-value {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .stat-mini .stat-label {
      font-size: 0.7rem;
      color: var(--hint);
      margin-top: 2px;
    }

    /* === RANKING — MEDAL KARTY === */
    .ranking-tabs {
      display: flex;
      gap: 4px;
      background: var(--secondary-bg);
      border-radius: 20px;
      padding: 3px;
      margin-bottom: 16px;
    }

    .ranking-tab {
      flex: 1;
      padding: 8px 0;
      border: none;
      border-radius: 16px;
      background: none;
      color: var(--hint);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      font-family: inherit;
    }

    .ranking-tab.active {
      background: var(--btn);
      color: var(--btn-text);
    }

    .ranking-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--section-bg);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.05);
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .ranking-medal {
      font-size: 1.6rem;
      width: 36px;
      text-align: center;
      flex-shrink: 0;
    }

    .ranking-position {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--secondary-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--hint);
      flex-shrink: 0;
    }

    .ranking-info {
      flex: 1;
      min-width: 0;
    }

    .ranking-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ranking-detail {
      font-size: 0.75rem;
      color: var(--hint);
      margin-top: 2px;
    }

    .ranking-value {
      font-weight: 700;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .ranking-value.green { color: var(--green); }
    .ranking-value.red { color: var(--red); }

    /* === PROFIL === */
    .profile-section {
      margin-bottom: 20px;
    }

    .profile-section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--section-header);
      margin-bottom: 10px;
    }

    .profile-card {
      background: var(--section-bg);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .profile-status {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--btn), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    .profile-name {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .profile-tier {
      font-size: 0.8rem;
      color: var(--hint);
      margin-top: 2px;
    }

    .pro-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 6px;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      padding: 6px 12px;
      border-radius: 16px;
      background: var(--secondary-bg);
      font-size: 0.78rem;
      color: var(--hint);
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag.selected {
      background: var(--btn);
      color: var(--btn-text);
      border-color: var(--btn);
    }

    .alert-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--secondary-bg);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
    }

    .alert-keyword {
      font-weight: 500;
      font-size: 0.9rem;
    }

    .alert-price {
      font-size: 0.8rem;
      color: var(--hint);
    }

    .alert-delete {
      color: var(--destructive);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 4px;
      border: none;
      background: none;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius);
      background: var(--btn);
      color: var(--btn-text);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-primary:active { transform: scale(0.98); opacity: 0.9; }

    .btn-secondary {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: var(--radius);
      background: var(--secondary-bg);
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-secondary:active { transform: scale(0.98); }

    .btn-upgrade {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      border: none;
    }

    /* === SKELETON LOADING === */
    .skeleton {
      background: linear-gradient(90deg,
        var(--secondary-bg) 25%,
        rgba(255,255,255,0.08) 50%,
        var(--secondary-bg) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-sm);
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-card {
      height: 70px;
      margin-bottom: 8px;
    }

    .skeleton-chip {
      height: 36px;
      width: 100px;
      flex-shrink: 0;
    }

    /* === PULL TO REFRESH === */
    .pull-indicator {
      text-align: center;
      padding: 12px;
      color: var(--hint);
      font-size: 0.8rem;
      transition: all 0.3s;
      overflow: hidden;
      max-height: 0;
    }

    .pull-indicator.visible {
      max-height: 50px;
    }

    .pull-indicator.refreshing::after {
      content: '';
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--hint);
      border-top-color: var(--btn);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* === PUSTE STANY === */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--hint);
    }

    .empty-state .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .empty-state .empty-text {
      font-size: 0.9rem;
    }

    /* === INPUT === */
    .input-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .input-field {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: var(--radius-sm);
      background: var(--secondary-bg);
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--btn);
    }

    .input-field::placeholder {
      color: var(--hint);
    }

    /* === TOGGLE SWITCH === */
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
    }

    .toggle-label {
      font-size: 0.9rem;
    }

    .toggle-switch {
      width: 44px;
      height: 24px;
      border-radius: 12px;
      background: var(--secondary-bg);
      border: 1px solid rgba(255,255,255,0.15);
      cursor: pointer;
      position: relative;
      transition: all 0.3s;
    }

    .toggle-switch.on {
      background: var(--btn);
      border-color: var(--btn);
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      top: 2px;
      left: 2px;
      transition: transform 0.3s;
    }

    .toggle-switch.on::after {
      transform: translateX(20px);
    }

    /* === SCROLLBAR (ukryj) === */
    ::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</head>
<body>

  <!-- === PULL TO REFRESH INDICATOR === -->
  <div class="pull-indicator" id="pullIndicator">Odśwież</div>

  <!-- ============================================ -->
  <!-- STRONA: CENY -->
  <!-- ============================================ -->
  <div class="page active" id="page-prices" data-tab="prices">
    <div class="page-header">Ceny materiałów</div>

    <!-- Kategorie — horyzontalny scroll -->
    <div class="category-scroll" id="priceCategories">
      <!-- Generowane dynamicznie -->
    </div>

    <!-- Filtry -->
    <div class="filter-bar" id="priceFilters">
      <button class="filter-btn active" data-sort="default">Domyślnie</button>
      <button class="filter-btn" data-sort="asc">Cena ↑</button>
      <button class="filter-btn" data-sort="desc">Cena ↓</button>
      <button class="filter-btn" data-sort="promo">Tylko promocje</button>
    </div>

    <!-- Lista produktów -->
    <div id="priceList">
      <!-- Skeleton loading -->
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- STRONA: NEWSY -->
  <!-- ============================================ -->
  <div class="page" id="page-news" data-tab="news">
    <div class="page-header">Newsy budowlane</div>

    <!-- Story circles ze źródłami -->
    <div class="stories-row" id="newsStories">
      <!-- Generowane dynamicznie -->
    </div>

    <!-- Lista newsów -->
    <div id="newsList">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- STRONA: TRENDY -->
  <!-- ============================================ -->
  <div class="page" id="page-trends" data-tab="trends">
    <div class="page-header">Trendy cenowe</div>

    <!-- Wybór kategorii -->
    <div class="category-scroll" id="trendCategories">
      <!-- Generowane dynamicznie -->
    </div>

    <!-- Przełącznik okresu -->
    <div class="period-toggle">
      <button class="period-btn active" data-period="7">7 dni</button>
      <button class="period-btn" data-period="30">30 dni</button>
      <button class="period-btn" data-period="90">90 dni</button>
    </div>

    <!-- Wykres -->
    <div class="chart-container">
      <canvas id="trendChart"></canvas>
    </div>

    <!-- Statystyki -->
    <div class="stats-grid" id="trendStats">
      <div class="stat-mini">
        <div class="stat-value" id="trendAvgChange">—</div>
        <div class="stat-label">Średnia zmiana</div>
      </div>
      <div class="stat-mini">
        <div class="stat-value" id="trendVolatility">—</div>
        <div class="stat-label">Zmienność</div>
      </div>
      <div class="stat-mini">
        <div class="stat-value" id="trendMin">—</div>
        <div class="stat-label">Minimum</div>
      </div>
      <div class="stat-mini">
        <div class="stat-value" id="trendMax">—</div>
        <div class="stat-label">Maksimum</div>
      </div>
    </div>

    <!-- Top spadki i wzrosty -->
    <div style="margin-top: 16px;">

      <div class="profile-section-title">ALERTY CENOWE</div>
      <div id="profileAlerts">

        <input type="number" class="input-field" id="alertPrice" placeholder="Cena" style="width:80px;">

  <!-- === TAB BAR === -->
  <div class="tab-bar">
    <button class="tab-item active" data-tab="prices" onclick="App.switchTab('prices')">

      <span>Ceny</span>
    </button>
    <button class="tab-item" data-tab="news" onclick="App.switchTab('news')">
      <span class="tab-icon">📰</span>
      <span>Newsy</span>
    </button>
    <button class="tab-item" data-tab="trends" onclick="App.switchTab('trends')">
      <span class="tab-icon">📉</span>
      <span>Trendy</span>
    </button>
    <button class="tab-item" data-tab="ranking" onclick="App.switchTab('ranking')">
      <span class="tab-icon">🏆</span>
      <span>Ranking</span>
    </button>
    <button class="tab-item" data-tab="profile" onclick="App.switchTab('profile')">
      <span class="tab-icon">⚙️</span>
      <span>Profil</span>
    </button>
  </div>

  <script>
    /**
     * Budowlaniec Bot — Telegram Mini App
     * Główna logika aplikacji webowej
     */
    (function() {
      'use strict';

      // === TELEGRAM WEBAPP SDK ===
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand(); // Pełny ekran
        tg.enableClosingConfirmation(); // Potwierdź zamknięcie
      }

      // Dane inicjalizacyjne z Telegrama
      const initData = tg?.initData || '';
      const user = tg?.initDataUnsafe?.user || {};
      const userId = user.id || '';

      // === KATEGORIE (zgodne z backendem) ===
      const CATEGORIES = [
        { slug: 'cement', label: 'Cement i beton', icon: '🧱' },
        { slug: 'stal', label: 'Stal i metale', icon: '🔩' },
        { slug: 'drewno', label: 'Drewno', icon: '🪵' },
        { slug: 'izolacja', label: 'Izolacja', icon: '🧊' },
        { slug: 'ceramika', label: 'Ceramika i płytki', icon: '🏺' },
        { slug: 'chemia-budowlana', label: 'Chemia budowlana', icon: '🧪' },
        { slug: 'instalacje', label: 'Instalacje', icon: '🔧' },
        { slug: 'dachy', label: 'Dachy', icon: '🏠' },
        { slug: 'okna-drzwi', label: 'Okna i drzwi', icon: '🪟' },
        { slug: 'narzedzia', label: 'Narzędzia', icon: '🛠️' },
      ];

      // Źródła newsów — ikony do story circles
      const NEWS_SOURCES = [
        { name: 'WNP', icon: '📰' },
        { name: 'PropertyNews', icon: '🏠' },
        { name: 'Bankier', icon: '💰' },
        { name: 'Muratordom', icon: '🏗️' },
        { name: 'Inżynier', icon: '📐' },
      ];

      // === STAN APLIKACJI ===
      const state = {
        currentTab: 'prices',
        prices: {
          category: 'cement',
          sort: 'default',
          data: [],
        },
        news: {
          data: [],
          source: null, // filtr po źródle
        },
        trends: {
          category: 'cement',
          period: 7,
          data: [],
        },
        ranking: {
          tab: 'drops',
          drops: [],
          promos: [],
          sellers: [],
        },
        profile: {
          data: null,
          alerts: [],
        },
        chart: null,
        isDark: true,
      };

      // === CACHE W PAMIĘCI (zamiast localStorage — nie wspierane w Telegram) ===
      const cache = {};

      function getCached(key, maxAge) {
        const item = cache[key];
        if (!item) return null;
        if (Date.now() - item.ts > maxAge) {
          delete cache[key];
          return null;
        }
        return item.data;
      }

      function setCache(key, data) {
        cache[key] = { data, ts: Date.now() };
      }

      // === FETCH Z RETRY I ERROR HANDLING ===
      async function apiFetch(url, options = {}) {
        const maxRetries = 2;
        for (let attempt = 0; attempt <= maxRetries; attempt++) {
          try {
            const res = await fetch(url, {
              ...options,
              headers: {
                'Content-Type': 'application/json',
                'X-Telegram-Init-Data': initData,
                ...(options.headers || {}),
              },
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
          } catch (err) {
            if (attempt === maxRetries) {
              console.error(`[API] Błąd po ${maxRetries + 1} próbach:`, url, err);
              return null;
            }
            // Czekaj przed ponowną próbą
            await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
          }
        }
      }

      // === HAPTIC FEEDBACK ===
      function haptic(type) {
        if (!tg?.HapticFeedback) return;
        switch (type) {
          case 'light': tg.HapticFeedback.impactOccurred('light'); break;
          case 'medium': tg.HapticFeedback.impactOccurred('medium'); break;
          case 'heavy': tg.HapticFeedback.impactOccurred('heavy'); break;
          case 'success': tg.HapticFeedback.notificationOccurred('success'); break;
          case 'error': tg.HapticFeedback.notificationOccurred('error'); break;
          case 'select': tg.HapticFeedback.selectionChanged(); break;
        }
      }

      // === PRZEŁĄCZANIE TABÓW ===
      function switchTab(tab) {
        if (tab === state.currentTab) return;
        haptic('select');

        state.currentTab = tab;

        // Aktualizuj taby
        document.querySelectorAll('.tab-item').forEach(el => {
          el.classList.toggle('active', el.dataset.tab === tab);
        });

        // Aktualizuj strony
        document.querySelectorAll('.page').forEach(el => {
          el.classList.toggle('active', el.dataset.tab === tab);
        });

        // Załaduj dane jeśli potrzeba
        loadTabData(tab);

        // BackButton Telegrama
        if (tg?.BackButton) {
          if (tab !== 'prices') {
            tg.BackButton.show();
            tg.BackButton.onClick(() => switchTab('prices'));
          } else {
            tg.BackButton.hide();
          }
        }
      }

      // === ŁADOWANIE DANYCH DLA TABA ===
      function loadTabData(tab) {
        switch (tab) {
          case 'prices': loadPrices(); break;
          case 'news': loadNews(); break;
          case 'trends': loadTrends(); break;
          case 'ranking': loadRanking(); break;
          case 'profile': loadProfile(); break;
        }
      }

      // ============================================
      // STRONA: CENY
      // ============================================

      function renderCategoryChips(containerId, categories, active, onSelect) {
        const container = document.getElementById(containerId);
        container.innerHTML = categories.map(c =>
          `<button class="category-chip ${c.slug === active ? 'active' : ''}"
                   data-slug="${c.slug}">${c.icon} ${c.label}</button>`
        ).join('');

        container.querySelectorAll('.category-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            haptic('light');
            onSelect(chip.dataset.slug);
            container.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
          });
        });
      }

      async function loadPrices() {
        const cacheKey = `prices_${state.prices.category}`;
        const cached = getCached(cacheKey, 60000); // 1 min cache
        if (cached) {
          state.prices.data = cached;
          renderPrices();
          return;
        }

        const data = await apiFetch(`/api/webapp/prices/${state.prices.category}`);
        if (data) {
          state.prices.data = data;
          setCache(cacheKey, data);
          renderPrices();
        }
      }

      function renderPrices() {
        let items = [...state.prices.data];

        // Filtrowanie
        if (state.prices.sort === 'promo') {
          items = items.filter(p => p.is_promo);
        }

        // Sortowanie
        if (state.prices.sort === 'asc') items.sort((a, b) => a.price - b.price);
        if (state.prices.sort === 'desc') items.sort((a, b) => b.price - a.price);

        const list = document.getElementById('priceList');

        if (items.length === 0) {
          list.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📦</div>
              <div class="empty-text">Brak produktów w tej kategorii</div>
            </div>`;
          return;
        }

        list.innerHTML = items.map(p => {
          const changeHtml = p.change_percent
            ? `<div class="product-change ${p.change_percent > 0 ? 'up' : 'down'}">
                 ${p.change_percent > 0 ? '📈' : '📉'} ${p.change_percent > 0 ? '+' : ''}${p.change_percent.toFixed(1)}%
               </div>`
            : '';

          const promoHtml = p.is_promo ? '<span class="badge-promo">PROMO</span>' : '';

          // Mini sparkline SVG jeśli są dane historyczne
          const sparkHtml = p.history && p.history.length > 1
            ? renderSparkline(p.history)
            : '';

          return `
            <div class="product-item" onclick="App.openProduct('${p.url || ''}')">
              <div class="product-info">
                <div class="product-name">${escapeHtml(p.name)}${promoHtml}</div>
                <div class="product-seller">🏪 ${escapeHtml(p.seller_slug)}</div>
              </div>
              ${sparkHtml}
              <div class="product-price-wrap">
                <div class="product-price">${p.price.toFixed(2)} zł</div>
                ${changeHtml}
              </div>
            </div>`;
        }).join('');
      }

      // Generuj mini sparkline SVG
      function renderSparkline(data) {
        if (!data || data.length < 2) return '';
        const w = 50, h = 20;
        const min = Math.min(...data);
        const max = Math.max(...data);
        const range = max - min || 1;

        const points = data.map((v, i) => {
          const x = (i / (data.length - 1)) * w;
          const y = h - ((v - min) / range) * h;
          return `${x},${y}`;
        }).join(' ');

        const color = data[data.length - 1] >= data[0] ? 'var(--red)' : 'var(--green)';

        return `<svg class="sparkline" viewBox="0 0 ${w} ${h}">
          <polyline fill="none" stroke="${color}" stroke-width="1.5" points="${points}"/>
        </svg>`;
      }

      // ============================================
      // STRONA: NEWSY
      // ============================================

      async function loadNews() {
        const cached = getCached('news', 120000); // 2 min cache
        if (cached) {
          state.news.data = cached;
          renderNews();
          return;
        }

        const data = await apiFetch('/api/webapp/news');
        if (data) {
          state.news.data = data;
          setCache('news', data);
          renderNews();
        }
      }

      function renderNews() {
        // Story circles
        const stories = document.getElementById('newsStories');
        stories.innerHTML = NEWS_SOURCES.map(s =>
          `<div class="story-circle" onclick="App.filterNewsBySource('${s.name}')">
            <div class="story-avatar">${s.icon}</div>
            <div class="story-name">${s.name}</div>
          </div>`
        ).join('');

        // Filtruj po źródle
        let articles = state.news.data;
        if (state.news.source) {
          articles = articles.filter(a =>
            a.source_name.toLowerCase().includes(state.news.source.toLowerCase())
          );
        }

        const list = document.getElementById('newsList');

        if (articles.length === 0) {
          list.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📰</div>
              <div class="empty-text">Brak newsów</div>
            </div>`;
          return;
        }

        list.innerHTML = articles.map(a => {
          const date = a.published_at
            ? new Date(a.published_at).toLocaleDateString('pl-PL', { day: '2-digit', month: 'short' })
            : '';

          return `
            <div class="news-card" onclick="App.openArticle('${escapeHtml(a.url)}')">
              <div class="news-title">${escapeHtml(a.title)}</div>
              ${a.summary ? `<div class="news-summary">${escapeHtml(a.summary)}</div>` : ''}
              <div class="news-meta">
                <span>${escapeHtml(a.source_name)}</span>
                <span>${date}</span>
              </div>
            </div>`;
        }).join('');
      }

      // ============================================
      // STRONA: TRENDY
      // ============================================

      async function loadTrends() {
        const key = `trends_${state.trends.category}_${state.trends.period}`;
        const cached = getCached(key, 120000);
        if (cached) {
          state.trends.data = cached;
          renderTrends();
          return;
        }

        const data = await apiFetch(
          `/api/webapp/trends/${state.trends.category}?period=${state.trends.period}d`
        );
        if (data) {
          state.trends.data = data;
          setCache(key, data);
          renderTrends();
        }
      }

      function renderTrends() {
        const data = state.trends.data;
        if (!data || data.length === 0) return;

        // Statystyki
        const prices = data.map(d => Number(d.avg_price));
        const minPrice = Math.min(...prices);
        const maxPrice = Math.max(...prices);
        const avgChange = prices.length > 1
          ? ((prices[prices.length - 1] - prices[0]) / prices[0] * 100).toFixed(1)
          : 0;

        // Zmienność (odchylenie standardowe)
        const mean = prices.reduce((a, b) => a + b, 0) / prices.length;
        const volatility = Math.sqrt(
          prices.reduce((sum, p) => sum + Math.pow(p - mean, 2), 0) / prices.length
        ).toFixed(2);

        document.getElementById('trendAvgChange').textContent = `${avgChange > 0 ? '+' : ''}${avgChange}%`;
        document.getElementById('trendAvgChange').style.color = avgChange > 0 ? 'var(--red)' : 'var(--green)';
        document.getElementById('trendVolatility').textContent = `${volatility} zł`;
        document.getElementById('trendMin').textContent = `${minPrice.toFixed(2)} zł`;
        document.getElementById('trendMax').textContent = `${maxPrice.toFixed(2)} zł`;

        // Wykres Chart.js
        const ctx = document.getElementById('trendChart');
        if (state.chart) state.chart.destroy();

        const labels = data.map(d => {
          const date = new Date(d.date);
          return date.toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit' });
        });

        state.chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [
              {
                label: 'Średnia cena (zł)',
                data: data.map(d => Number(d.avg_price)),
                borderColor: 'var(--btn)',
                backgroundColor: 'rgba(59,130,246,0.1)',
                fill: true,
                tension: 0.3,
                pointRadius: data.length > 30 ? 0 : 3,
                pointHoverRadius: 6,
                borderWidth: 2,
              },
              {
                label: 'Min',
                data: data.map(d => Number(d.min_price)),
                borderColor: 'var(--green)',
                borderDash: [4, 4],
                fill: false,
                tension: 0.3,
                pointRadius: 0,
                borderWidth: 1,
              },
              {
                label: 'Max',
                data: data.map(d => Number(d.max_price)),
                borderColor: 'var(--red)',
                borderDash: [4, 4],
                fill: false,
                tension: 0.3,
                pointRadius: 0,
                borderWidth: 1,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: {
                labels: {
                  color: getComputedStyle(document.body).getPropertyValue('--hint').trim() || '#94a3b8',
                  font: { size: 11 },
                  boxWidth: 12,
                },
              },
            },
            scales: {
              x: {
                ticks: { color: '#64748b', maxRotation: 45, font: { size: 10 } },
                grid: { color: 'rgba(71,85,105,0.2)' },
              },
              y: {
                ticks: { color: '#64748b', callback: v => v + ' zł', font: { size: 10 } },
                grid: { color: 'rgba(71,85,105,0.2)' },
              },
            },
          },
        });
      }

      // ============================================
      // STRONA: RANKING
      // ============================================

      async function loadRanking() {
        const tab = state.ranking.tab;
        const cacheKey = `ranking_${tab}`;
        const cached = getCached(cacheKey, 120000);
        if (cached) {
          state.ranking[tab] = cached;
          renderRanking();
          return;
        }

        const endpoints = {
          drops: '/api/webapp/ranking/drops',
          promos: '/api/webapp/ranking/promos',
          sellers: '/api/webapp/ranking/sellers',
        };

        const data = await apiFetch(endpoints[tab]);
        if (data) {
          state.ranking[tab] = data;
          setCache(cacheKey, data);
          renderRanking();
        }
      }

      function renderRanking() {
        const tab = state.ranking.tab;
        const data = state.ranking[tab];
        const list = document.getElementById('rankingList');

        if (!data || data.length === 0) {
          list.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">🏆</div>
              <div class="empty-text">Brak danych rankingu</div>
            </div>`;
          return;
        }

        const medals = ['🥇', '🥈', '🥉'];

        if (tab === 'drops') {
          list.innerHTML = data.map((item, i) => `
            <div class="ranking-item" style="animation-delay: ${i * 50}ms">
              ${i < 3
                ? `<div class="ranking-medal">${medals[i]}</div>`
                : `<div class="ranking-position">${i + 1}</div>`
              }
              <div class="ranking-info">
                <div class="ranking-name">${escapeHtml(item.product_name)}</div>
                <div class="ranking-detail">🏪 ${item.seller_slug} · ${Number(item.prev_price).toFixed(2)} → ${Number(item.current_price).toFixed(2)} zł</div>
              </div>
              <div class="ranking-value green">${Number(item.change_percent).toFixed(1)}%</div>
            </div>
          `).join('');
        }

        if (tab === 'promos') {
          list.innerHTML = data.map((item, i) => `
            <div class="ranking-item" style="animation-delay: ${i * 50}ms">
              ${i < 3
                ? `<div class="ranking-medal">${medals[i]}</div>`
                : `<div class="ranking-position">${i + 1}</div>`
              }
              <div class="ranking-info">
                <div class="ranking-name">${escapeHtml(item.product_name)}</div>
                <div class="ranking-detail">🏪 ${item.seller_slug} · <s>${Number(item.original_price).toFixed(2)}</s> → ${Number(item.price).toFixed(2)} zł</div>
              </div>
              <div class="ranking-value green">-${Number(item.discount_percent).toFixed(0)}%</div>
            </div>
          `).join('');
        }

        if (tab === 'sellers') {
          list.innerHTML = data.map((item, i) => `
            <div class="ranking-item" style="animation-delay: ${i * 50}ms">
              ${i < 3
                ? `<div class="ranking-medal">${medals[i]}</div>`
                : `<div class="ranking-position">${i + 1}</div>`
              }
              <div class="ranking-info">
                <div class="ranking-name">${escapeHtml(item.seller_slug)}</div>
                <div class="ranking-detail">${item.product_count} produktów · ${item.promo_count} promocji</div>
              </div>
              <div class="ranking-value">${Number(item.avg_price).toFixed(0)} zł</div>
            </div>
          `).join('');
        }
      }

      // ============================================
      // STRONA: PROFIL
      // ============================================

      async function loadProfile() {
        if (!userId) {
          renderProfileEmpty();
          return;
        }

        const data = await apiFetch(`/api/webapp/profile?tg_id=${userId}`);
        if (data) {
          state.profile.data = data;
          renderProfile();
        }

        // Załaduj alerty
        const alerts = await apiFetch(`/api/webapp/profile/alerts?tg_id=${userId}`);
        if (alerts) {
          state.profile.alerts = alerts;
          renderAlerts();
        }
      }

      function renderProfileEmpty() {
        document.getElementById('profileName').textContent = user.first_name || 'Użytkownik';
        document.getElementById('profileTier').textContent = 'Plan Free';
      }

      function renderProfile() {
        const p = state.profile.data;
        if (!p) return;

        document.getElementById('profileName').textContent = p.name || user.first_name || 'Użytkownik';

        if (p.is_pro) {
          document.getElementById('profileTier').innerHTML = 'Plan <span class="pro-badge">PRO</span>';
          document.getElementById('upgradeSection').style.display = 'none';
        } else {
          document.getElementById('profileTier').textContent = 'Plan Free';
        }

        const limit = p.is_pro ? 20 : 5;
        document.getElementById('profileAiQueries').textContent =
          `${p.ai_queries_today || 0}/${limit}`;

        // Kategorie
        const catContainer = document.getElementById('profileCategories');
        catContainer.innerHTML = CATEGORIES.map(c => {
          const selected = p.categories && p.categories.includes(c.slug);
          return `<button class="tag ${selected ? 'selected' : ''}"
                    onclick="App.toggleCategory('${c.slug}')">${c.icon} ${c.label}</button>`;
        }).join('');
      }

      function renderAlerts() {
        const container = document.getElementById('profileAlerts');
        const alerts = state.profile.alerts;

        if (!alerts || alerts.length === 0) {
          container.innerHTML = '<div style="color:var(--hint); font-size:0.8rem; padding:8px 0;">Brak alertów</div>';
          return;
        }

        container.innerHTML = alerts.map(a => `
          <div class="alert-item">
            <div>
              <div class="alert-keyword">${escapeHtml(a.keyword)}</div>
              <div class="alert-price">Poniżej ${Number(a.target_price).toFixed(2)} zł</div>
            </div>
            <button class="alert-delete" onclick="App.deleteAlert('${a.id}')">✕</button>
          </div>
        `).join('');
      }

      // ============================================
      // AKCJE UŻYTKOWNIKA
      // ============================================

      async function addAlert() {
        const keyword = document.getElementById('alertKeyword').value.trim();
        const price = parseFloat(document.getElementById('alertPrice').value);

        if (!keyword || isNaN(price) || price <= 0) {
          haptic('error');
          return;
        }

        haptic('medium');
        const result = await apiFetch('/api/webapp/alerts', {
          method: 'POST',
          body: JSON.stringify({ tg_id: userId, keyword, target_price: price }),
        });

        if (result) {
          haptic('success');
          document.getElementById('alertKeyword').value = '';
          document.getElementById('alertPrice').value = '';
          loadProfile(); // Odśwież alerty
        }
      }

      async function deleteAlert(alertId) {
        haptic('medium');
        const result = await apiFetch(`/api/webapp/alerts/${alertId}?tg_id=${userId}`, {
          method: 'DELETE',
        });
        if (result) {
          haptic('success');
          loadProfile();
        }
      }

      async function toggleCategory(slug) {
        haptic('select');
        const p = state.profile.data;
        if (!p) return;

        let cats = p.categories ? [...p.categories] : [];
        if (cats.includes(slug)) {
          cats = cats.filter(c => c !== slug);
        } else {
          cats.push(slug);
        }

        // Pokaż MainButton do zapisu
        if (tg?.MainButton) {
          tg.MainButton.setText('Zapisz kategorie');
          tg.MainButton.show();
          tg.MainButton.onClick(async () => {
            tg.MainButton.showProgress();
            await apiFetch('/api/webapp/profile/categories', {
              method: 'POST',
              body: JSON.stringify({ tg_id: userId, categories: cats }),
            });
            tg.MainButton.hideProgress();
            tg.MainButton.hide();
            haptic('success');
            loadProfile();
          });
        }

        // Aktualizuj lokalnie
        p.categories = cats;
        renderProfile();
      }

      function toggleTheme() {
        haptic('light');
        state.isDark = !state.isDark;
        const toggle = document.getElementById('themeToggle');
        toggle.classList.toggle('on', state.isDark);

        if (tg?.setHeaderColor) {
          tg.setHeaderColor(state.isDark ? '#1a1a2e' : '#ffffff');
        }
        if (tg?.setBackgroundColor) {
          tg.setBackgroundColor(state.isDark ? '#1a1a2e' : '#f5f5f5');
        }
      }

      function upgradePro() {
        haptic('medium');
        // Otwórz link do informacji o PRO (lub invoice)
        if (tg?.openTelegramLink) {
          tg.openTelegramLink('https://t.me/' + (tg.initDataUnsafe?.bot?.username || '') + '?start=pro');
        }
      }

      function openProduct(url) {
        if (!url) return;
        haptic('light');
        if (tg?.openLink) {
          tg.openLink(url);
        } else {
          window.open(url, '_blank');
        }
      }

      function openArticle(url) {
        if (!url) return;
        haptic('light');
        if (tg?.openLink) {
          tg.openLink(url);
        } else {
          window.open(url, '_blank');
        }
      }

      function filterNewsBySource(source) {
        haptic('light');
        state.news.source = state.news.source === source ? null : source;
        renderNews();
      }

      // ============================================
      // PULL TO REFRESH
      // ============================================

      let pullStartY = 0;
      let isPulling = false;

      document.addEventListener('touchstart', (e) => {
        if (window.scrollY === 0) {
          pullStartY = e.touches[0].clientY;
          isPulling = true;
        }
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (!isPulling) return;
        const diff = e.touches[0].clientY - pullStartY;
        if (diff > 50) {
          document.getElementById('pullIndicator').classList.add('visible');
        }
      }, { passive: true });

      document.addEventListener('touchend', () => {
        if (!isPulling) return;
        isPulling = false;
        const indicator = document.getElementById('pullIndicator');
        if (indicator.classList.contains('visible')) {
          indicator.classList.add('refreshing');
          indicator.textContent = 'Odświeżam...';

          // Wyczyść cache i załaduj dane
          Object.keys(cache).forEach(k => delete cache[k]);
          loadTabData(state.currentTab);

          setTimeout(() => {
            indicator.classList.remove('visible', 'refreshing');
            indicator.textContent = 'Odśwież';
          }, 1500);
        }
      }, { passive: true });

      // ============================================
      // INICJALIZACJA
      // ============================================

      function init() {
        // Wyrenderuj kategorie chipsy
        renderCategoryChips('priceCategories', CATEGORIES, state.prices.category, (slug) => {
          state.prices.category = slug;
          loadPrices();
        });

        renderCategoryChips('trendCategories', CATEGORIES, state.trends.category, (slug) => {
          state.trends.category = slug;
          loadTrends();
        });

        // Filtry cenowe
        document.querySelectorAll('#priceFilters .filter-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            haptic('light');
            state.prices.sort = btn.dataset.sort;
            document.querySelectorAll('#priceFilters .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPrices();
          });
        });

        // Przełącznik okresu trendów
        document.querySelectorAll('.period-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            haptic('light');
            state.trends.period = parseInt(btn.dataset.period);
            document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadTrends();
          });
        });

        // Taby rankingu
        document.querySelectorAll('.ranking-tab').forEach(tab => {
          tab.addEventListener('click', () => {
            haptic('select');
            state.ranking.tab = tab.dataset.ranking;
            document.querySelectorAll('.ranking-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            loadRanking();
          });
        });

        // Załaduj pierwszą stronę
        loadPrices();
      }

      // === UTILS ===
      function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // === PUBLICZNE API ===
      window.App = {
        switchTab,
        openProduct,
        openArticle,
        filterNewsBySource,
        addAlert,
        deleteAlert,
        toggleCategory,
        toggleTheme,
        upgradePro,
      };

      // Start po załadowaniu DOM
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
