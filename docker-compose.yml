version: '3.8'

services:
  app:
    build: .
    container_name: spektra-network
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://spektra:spektra_secure_2024@postgres:5432/spektra_db
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AI_DAILY_LIMIT_FREE=${AI_DAILY_LIMIT_FREE:-5}
      - AI_DAILY_LIMIT_PRO=${AI_DAILY_LIMIT_PRO:-20}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./public:/app/public
    networks:
      - spektra-net

  postgres:
    image: postgres:16-alpine
    container_name: spektra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spektra
      POSTGRES_PASSWORD: spektra_secure_2024
      POSTGRES_DB: spektra_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spektra -d spektra_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spektra-net

  redis:
    image: redis:7-alpine
    container_name: spektra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spektra-net

volumes:
  pgdata:
  redisdata:

networks:
  spektra-net:
    driver: bridge
